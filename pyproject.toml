[project]
name = "medinest"
version = "0.1.0"
description = "Priority-based medicine booking and allocation module"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
medinest = "medicine_booking.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medicine_booking = ["static/*"]
